<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skyline Capital — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Space Grotesk', 'Inter', 'sans-serif'] },
        colors: {
          ink: { 950: '#050B1F', 900: '#0A1128', 800: '#0F1A3A', 700: '#1A2650', 600: '#2A3A6B' },
          brand: { cyan: '#22D3EE', blue: '#3B82F6', indigo: '#6366F1', gold: '#F4C430' }
        }
      }
    }
  }
</script>
<style>
  * { font-family: 'Inter', system-ui, sans-serif; }
  body { background: #050B1F; color: #E2E8F0; overflow-x: hidden; }
  .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); }
  .gradient-brand { background: linear-gradient(135deg, #22D3EE 0%, #3B82F6 50%, #6366F1 100%); }
  .gradient-ink { background: linear-gradient(180deg, #0A1128 0%, #050B1F 100%); }
  .gradient-admin { background: linear-gradient(135deg, #F4C430 0%, #F59E0B 50%, #EF4444 100%); }
  .fade-in { animation: fadeIn 0.5s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .scale-in { animation: scaleIn 0.3s ease-out; }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .slide-in-right { animation: slideInRight 0.35s cubic-bezier(0.16,1,0.3,1); }
  @keyframes slideInRight { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  .input-field { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #E2E8F0; transition: all 0.2s; }
  .input-field:focus { outline: none; border-color: #F4C430; background: rgba(255,255,255,0.06); box-shadow: 0 0 0 3px rgba(244,196,48,0.15); }
  .nav-item { transition: all 0.2s; position: relative; }
  .nav-item:hover { background: rgba(244,196,48,0.08); color: #F4C430; }
  .nav-item.active { background: linear-gradient(90deg, rgba(244,196,48,0.15), transparent); color: #F4C430; }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: linear-gradient(180deg, #F4C430, #EF4444); border-radius: 0 3px 3px 0; }
  .btn-primary { background: linear-gradient(135deg, #F4C430 0%, #F59E0B 100%); color: #0A1128; transition: all 0.2s; font-weight: 600; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 30px -5px rgba(244,196,48,0.4); }
  .btn-ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #E2E8F0; transition: all 0.2s; }
  .btn-ghost:hover { background: rgba(255,255,255,0.1); border-color: rgba(244,196,48,0.3); }
  .btn-approve { background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: white; }
  .btn-reject { background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%); color: white; }
  .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3; pointer-events: none; }
  .admin-badge { background: linear-gradient(135deg, #F4C430, #EF4444); color: #0A1128; font-weight: 700; font-size: 10px; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.5px; }
  @media (max-width: 1023px) {
    .sidebar-desktop { transform: translateX(-100%); transition: transform 0.3s; position: fixed; z-index: 50; }
    .sidebar-desktop.open { transform: translateX(0); }
  }
</style>
</head>
<body>

<div id="toastContainer" class="fixed top-4 right-4 z-[9999] space-y-2 pointer-events-none"></div>
<div id="modalContainer" class="fixed inset-0 z-[9998] hidden bg-black/70 backdrop-blur-sm items-center justify-center p-4">
  <div id="modalContent" class="glass rounded-3xl shadow-2xl max-w-lg w-full p-6 scale-in pointer-events-auto max-h-[90vh] overflow-y-auto"></div>
</div>
<div id="app"></div>

<script>
// ⚠️ REPLACE WITH YOUR SUPABASE CREDENTIALS
const SUPABASE_URL = 'https://amxoyqmuhmzlfabginjg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFteG95cW11aG16bGZhYmdpbmpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDEyOTMsImV4cCI6MjEwMzYxNzI5M30.UQIj0a7IbIIX8idr_zboWHRTcRK9izVpOLkY6i7aAeI';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = {
  users: [], accounts: [], transactions: [], pendingRequests: [], tickets: [], notifications: [], charts: {}
};

const $ = (s) => document.querySelector(s);
const fmt = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const fmtRelative = (d) => {
  if (!d) return '';
  const diff = (Date.now() - new Date(d)) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  return fmtDate(d);
};

function toast(message, type = 'info') {
  const colors = { success: 'from-emerald-500 to-teal-500', error: 'from-rose-500 to-red-500', info: 'from-sky-500 to-blue-500', warning: 'from-amber-500 to-orange-500' };
  const icons = { success: 'check-circle-2', error: 'x-circle', info: 'info', warning: 'alert-triangle' };
  const el = document.createElement('div');
  el.className = `slide-in-right pointer-events-auto flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-white bg-gradient-to-r ${colors[type]} min-w-[280px] max-w-md border border-white/10`;
  el.innerHTML = `<i data-lucide="${icons[type]}" class="w-5 h-5 flex-shrink-0"></i><span class="text-sm font-medium flex-1">${message}</span><button onclick="this.parentElement.remove()" class="opacity-60 hover:opacity-100"><i data-lucide="x" class="w-4 h-4"></i></button>`;
  $('#toastContainer').appendChild(el);
  lucide.createIcons();
  setTimeout(() => { el.style.transition = 'all 0.3s'; el.style.opacity = '0'; el.style.transform = 'translateX(120%)'; setTimeout(() => el.remove(), 300); }, 4000);
}

function openModal(html) {
  $('#modalContent').innerHTML = html;
  $('#modalContainer').classList.remove('hidden');
  $('#modalContainer').classList.add('flex');
  lucide.createIcons();
}
function closeModal() {
  $('#modalContainer').classList.add('hidden');
  $('#modalContainer').classList.remove('flex');
}
$('#modalContainer').addEventListener('click', (e) => { if (e.target.id === 'modalContainer') closeModal(); });

const emptyState = (icon, title, subtitle) => `
  <div class="flex flex-col items-center justify-center py-16 px-6 text-center fade-in">
    <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-ink-700 to-ink-800 flex items-center justify-center mb-5 border border-white/5">
      <i data-lucide="${icon}" class="w-9 h-9 text-slate-500"></i>
    </div>
    <h3 class="text-lg font-semibold text-slate-200 mb-2">${title}</h3>
    <p class="text-sm text-slate-500 max-w-sm">${subtitle}</p>
  </div>
`;

// ==========================================
// DIRECT LOAD (NO AUTH CHECKS)
// ==========================================
async function loadAllData() {
  const [users, accounts, transactions, tickets, notifications] = await Promise.all([
    sb.from('profiles').select('*').order('created_at', { ascending: false }),
    sb.from('accounts').select('*'),
    sb.from('transactions').select('*').order('created_at', { ascending: false }).limit(500),
    sb.from('support_tickets').select('*').order('created_at', { ascending: false }),
    sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(100)
  ]);
  state.users = users.data || [];
  state.accounts = accounts.data || [];
  state.transactions = transactions.data || [];
  state.tickets = tickets.data || [];
  state.notifications = notifications.data || [];
  state.pendingRequests = state.transactions.filter(t => t.status === 'pending');
}

function renderShell(view) {
  const pendingCount = state.pendingRequests.length;
  const openTickets = state.tickets.filter(t => t.status === 'open').length;

  $('#app').innerHTML = `
    <div class="flex min-h-screen gradient-ink">
      <aside id="sidebar" class="sidebar-desktop w-64 bg-ink-900 border-r border-white/5 h-screen flex flex-col lg:sticky lg:top-0">
        <div class="p-6 border-b border-white/5">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 gradient-admin rounded-xl flex items-center justify-center"><i data-lucide="shield" class="w-5 h-5 text-white"></i></div>
            <div><div class="font-display font-bold text-white leading-none">SKYLINE</div><div class="text-[9px] tracking-[0.3em] text-brand-gold font-semibold">ADMIN</div></div>
          </div>
        </div>
        <nav class="flex-1 p-4 overflow-y-auto">
          <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-widest mb-3 px-3">Overview</div>
          <a href="#" onclick="switchView('overview'); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 text-sm font-medium mb-1 ${view==='overview'?'active':''}"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Dashboard</span></a>
          <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-widest mb-3 mt-6 px-3">Management</div>
          <a href="#" onclick="switchView('users'); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 text-sm font-medium mb-1 ${view==='users'?'active':''}"><i data-lucide="users" class="w-4 h-4"></i><span>Users</span><span class="ml-auto text-xs text-slate-500">${state.users.length}</span></a>
          <a href="#" onclick="switchView('accounts'); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 text-sm font-medium mb-1 ${view==='accounts'?'active':''}"><i data-lucide="wallet" class="w-4 h-4"></i><span>Accounts</span></a>
          <a href="#" onclick="switchView('transactions'); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 text-sm font-medium mb-1 ${view==='transactions'?'active':''}"><i data-lucide="arrow-left-right" class="w-4 h-4"></i><span>Transactions</span></a>
          <a href="#" onclick="switchView('pending'); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 text-sm font-medium mb-1 ${view==='pending'?'active':''}"><i data-lucide="clock" class="w-4 h-4"></i><span>Pending</span>${pendingCount > 0 ? `<span class="ml-auto bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">${pendingCount}</span>` : ''}</a>
          <a href="#" onclick="switchView('tickets'); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 text-sm font-medium mb-1 ${view==='tickets'?'active':''}"><i data-lucide="life-buoy" class="w-4 h-4"></i><span>Support</span>${openTickets > 0 ? `<span class="ml-auto bg-amber-500 text-ink-950 text-[10px] font-bold px-1.5 py-0.5 rounded-full">${openTickets}</span>` : ''}</a>
          <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-widest mb-3 mt-6 px-3">Communication</div>
          <a href="#" onclick="switchView('broadcast'); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 text-sm font-medium mb-1 ${view==='broadcast'?'active':''}"><i data-lucide="megaphone" class="w-4 h-4"></i><span>Broadcast</span></a>
        </nav>
        <div class="p-4 border-t border-white/5">
          <button onclick="doLogout()" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-rose-400 text-sm font-medium hover:bg-rose-500/10"><i data-lucide="log-out" class="w-4 h-4"></i><span>Back to App</span></button>
        </div>
      </aside>

      <div class="flex-1 flex flex-col min-w-0">
        <header class="bg-ink-900/80 backdrop-blur-xl border-b border-white/5 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
          <div class="flex items-center gap-4 flex-1">
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-300"><i data-lucide="menu" class="w-6 h-6"></i></button>
            <div><div class="flex items-center gap-2"><h1 class="font-display text-xl font-bold text-white" id="pageTitle">Dashboard</h1><span class="admin-badge">ADMIN</span></div><p class="text-xs text-slate-500" id="pageSubtitle">System overview</p></div>
          </div>
          <button onclick="loadAllData().then(() => { renderShell('${view}'); toast('Data refreshed', 'success'); })" class="p-2 hover:bg-white/5 rounded-xl transition"><i data-lucide="refresh-cw" class="w-5 h-5 text-slate-300"></i></button>
        </header>
        <main class="flex-1 p-6 overflow-y-auto"><div id="pageContent" class="fade-in max-w-7xl mx-auto"></div></main>
      </div>
    </div>
    <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-40 lg:hidden" onclick="toggleSidebar()"></div>
  `;
  lucide.createIcons();
  const renderers = { overview: renderOverview, users: renderUsers, accounts: renderAccounts, transactions: renderTransactions, pending: renderPending, tickets: renderTickets, broadcast: renderBroadcast };
  (renderers[view] || renderOverview)();
}

function toggleSidebar() { $('#sidebar').classList.toggle('open'); $('#sidebarOverlay').classList.toggle('hidden'); }
function switchView(view) { renderShell(view); if (window.innerWidth < 1024) toggleSidebar(); }
function doLogout() { window.location.href = 'index.html'; }

// --- OVERVIEW ---
function renderOverview() {
  $('#pageTitle').textContent = 'Dashboard Overview';
  $('#pageSubtitle').textContent = 'System-wide metrics and activity';
  const totalBalance = state.accounts.reduce((s, a) => s + Number(a.balance || 0), 0);
  const openTickets = state.tickets.filter(t => t.status === 'open').length;
  const recentTx = state.transactions.slice(0, 8);

  $('#pageContent').innerHTML = `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      ${[
        { label: 'Total Users', value: state.users.length, icon: 'users', color: 'from-brand-cyan to-brand-blue' },
        { label: 'Total Balance', value: fmt(totalBalance), icon: 'wallet', color: 'from-emerald-500 to-teal-500' },
        { label: 'Pending Requests', value: state.pendingRequests.length, icon: 'clock', color: 'from-amber-500 to-orange-500' },
        { label: 'Open Tickets', value: openTickets, icon: 'life-buoy', color: 'from-rose-500 to-pink-500' }
      ].map(s => `
        <div class="glass rounded-2xl p-5 hover:border-brand-gold/20 transition">
          <div class="w-10 h-10 bg-gradient-to-br ${s.color} rounded-xl flex items-center justify-center mb-3"><i data-lucide="${s.icon}" class="w-5 h-5 text-white"></i></div>
          <div class="text-xs text-slate-400 mb-1">${s.label}</div>
          <div class="font-display text-2xl font-bold text-white">${s.value}</div>
        </div>
      `).join('')}
    </div>
    <div class="glass rounded-2xl overflow-hidden">
      <div class="p-6 border-b border-white/5 flex items-center justify-between">
        <div><h3 class="font-display font-bold text-white">Recent Activity</h3><p class="text-xs text-slate-400">Latest system-wide transactions</p></div>
        <button onclick="switchView('transactions')" class="text-sm text-brand-gold hover:text-amber-400 font-medium flex items-center gap-1">View All <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
      </div>
      ${recentTx.length === 0 ? emptyState('inbox', 'No activity yet', 'Transactions will appear here as users make them.') : `
        <div class="divide-y divide-white/5">
          ${recentTx.map(tx => {
            const user = state.users.find(u => u.id === tx.user_id);
            const isCredit = tx.type === 'credit';
            return `<div class="p-4 hover:bg-white/5 transition flex items-center gap-4">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${isCredit ? 'bg-emerald-500/10' : 'bg-rose-500/10'}"><i data-lucide="${isCredit ? 'arrow-down-left' : 'arrow-up-right'}" class="w-5 h-5 ${isCredit ? 'text-emerald-400' : 'text-rose-400'}"></i></div>
              <div class="flex-1 min-w-0"><div class="font-semibold text-white text-sm truncate">${tx.description || 'Transaction'}</div><div class="text-xs text-slate-500">${user?.full_name || 'Unknown user'} · ${fmtDate(tx.created_at)}</div></div>
              <div class="text-right"><div class="font-display font-bold text-sm ${isCredit ? 'text-emerald-400' : 'text-white'}">${isCredit ? '+' : '-'}${fmt(tx.amount)}</div><div class="text-xs ${tx.status === 'completed' ? 'text-emerald-400' : tx.status === 'pending' ? 'text-amber-400' : 'text-rose-400'} capitalize">${tx.status}</div></div>
            </div>`;
          }).join('')}
        </div>
      `}
    </div>
  `;
  lucide.createIcons();
}

// --- USERS ---
function renderUsers() {
  $('#pageTitle').textContent = 'User Management';
  $('#pageSubtitle').textContent = `${state.users.length} registered users`;
  let search = '';
  const render = () => {
    let list = [...state.users];
    if (search) list = list.filter(u => (u.full_name || '').toLowerCase().includes(search.toLowerCase()) || (u.email || '').toLowerCase().includes(search.toLowerCase()));
    $('#pageContent').innerHTML = `
      <div class="glass rounded-2xl overflow-hidden">
        <div class="p-6 border-b border-white/5"><div class="relative max-w-md"><i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i><input id="userSearch" type="text" placeholder="Search users..." value="${search}" class="input-field w-full pl-10 pr-4 py-2 rounded-xl text-sm"></div></div>
        ${list.length === 0 ? emptyState('users', search ? 'No users found' : 'No users yet', 'Users will appear here after registration.') : `
          <div class="overflow-x-auto"><table class="w-full">
            <thead class="bg-white/5"><tr class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider"><th class="px-6 py-3">User</th><th class="px-6 py-3">Account</th><th class="px-6 py-3">Balance</th><th class="px-6 py-3">Role</th><th class="px-6 py-3 text-right">Actions</th></tr></thead>
            <tbody class="divide-y divide-white/5">
              ${list.map(u => {
                const account = state.accounts.find(a => a.user_id === u.id);
                return `<tr class="hover:bg-white/5 transition">
                  <td class="px-6 py-4"><div class="flex items-center gap-3"><div class="w-10 h-10 gradient-brand rounded-full flex items-center justify-center text-white font-bold text-sm">${(u.full_name || 'U').charAt(0).toUpperCase()}</div><div><div class="font-semibold text-white text-sm">${u.full_name || 'Unnamed'}</div><div class="text-xs text-slate-500">${u.email}</div></div></div></td>
                  <td class="px-6 py-4 text-sm font-mono text-slate-300">${account?.account_number || '—'}</td>
                  <td class="px-6 py-4 text-sm font-display font-bold text-white">${fmt(account?.balance || 0)}</td>
                  <td class="px-6 py-4"><span class="px-2 py-1 text-xs font-semibold rounded-full ${u.role === 'admin' ? 'bg-brand-gold/20 text-brand-gold border border-brand-gold/30' : 'bg-white/5 text-slate-400 border border-white/10'}">${u.role || 'user'}</span></td>
                  <td class="px-6 py-4 text-right"><div class="flex gap-2 justify-end"><button onclick="openAdjustBalance('${u.id}')" class="p-2 hover:bg-brand-cyan/10 rounded-lg text-brand-cyan transition"><i data-lucide="wallet" class="w-4 h-4"></i></button></div></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table></div>
        `}
      </div>
    `;
    lucide.createIcons();
    $('#userSearch').addEventListener('input', (e) => { search = e.target.value; render(); });
  };
  render();
}

window.openAdjustBalance = (userId) => {
  const user = state.users.find(u => u.id === userId);
  const account = state.accounts.find(a => a.user_id === userId);
  if (!user || !account) return;
  openModal(`
    <div class="flex items-center justify-between mb-6"><h3 class="font-display text-xl font-bold text-white">Adjust Balance</h3><button onclick="closeModal()" class="p-1 hover:bg-white/10 rounded-lg"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button></div>
    <div class="p-4 bg-white/5 rounded-xl border border-white/5 mb-4"><div class="flex items-center gap-3"><div class="w-10 h-10 gradient-brand rounded-full flex items-center justify-center text-white font-bold">${(user.full_name || 'U').charAt(0).toUpperCase()}</div><div><div class="font-semibold text-white">${user.full_name}</div><div class="text-xs text-slate-400">Current: ${fmt(account.balance)}</div></div></div></div>
    <form id="adjustForm" class="space-y-4">
      <div><label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">ACTION</label><select id="adjAction" class="input-field w-full px-4 py-2.5 rounded-xl"><option value="add">Add Funds (Credit)</option><option value="remove">Remove Funds (Debit)</option></select></div>
      <div><label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">AMOUNT (USD)</label><input type="number" id="adjAmount" required min="0.01" step="0.01" class="input-field w-full px-4 py-2.5 rounded-xl font-display font-bold text-lg" placeholder="0.00"></div>
      <div><label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">REASON</label><input type="text" id="adjReason" required class="input-field w-full px-4 py-2.5 rounded-xl" placeholder="Admin adjustment"></div>
      <button type="submit" class="btn-primary w-full py-3 rounded-xl">Apply Adjustment</button>
    </form>
  `);
  $('#adjustForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const action = $('#adjAction').value;
    const amount = parseFloat($('#adjAmount').value);
    const reason = $('#adjReason').value;
    const currentBalance = Number(account.balance || 0);
    const newBalance = action === 'add' ? currentBalance + amount : currentBalance - amount;
    if (action === 'remove' && newBalance < 0) { toast('Insufficient funds', 'error'); return; }
    try {
      await sb.from('accounts').update({ balance: newBalance, available_balance: newBalance }).eq('id', account.id);
      await sb.from('transactions').insert({ user_id: userId, account_id: account.id, type: action === 'add' ? 'credit' : 'debit', category: 'admin', description: `Admin: ${reason}`, amount: amount, currency: 'USD', reference: 'ADJ' + Date.now().toString().slice(-8), status: 'completed' });
      toast('Balance adjusted', 'success');
      closeModal();
      await loadAllData();
      renderUsers();
    } catch (err) { toast(err.message, 'error'); }
  });
};

// --- ACCOUNTS ---
function renderAccounts() {
  $('#pageTitle').textContent = 'All Accounts';
  $('#pageSubtitle').textContent = `${state.accounts.length} accounts`;
  const total = state.accounts.reduce((s, a) => s + Number(a.balance || 0), 0);
  $('#pageContent').innerHTML = `
    <div class="grid md:grid-cols-3 gap-4 mb-6">
      <div class="glass rounded-2xl p-5"><div class="text-xs text-slate-400 mb-1">Total Accounts</div><div class="font-display text-2xl font-bold text-white">${state.accounts.length}</div></div>
      <div class="glass rounded-2xl p-5"><div class="text-xs text-slate-400 mb-1">Combined Balance</div><div class="font-display text-2xl font-bold text-white">${fmt(total)}</div></div>
      <div class="glass rounded-2xl p-5"><div class="text-xs text-slate-400 mb-1">Active Accounts</div><div class="font-display text-2xl font-bold text-white">${state.accounts.filter(a => a.status === 'active').length}</div></div>
    </div>
    <div class="glass rounded-2xl overflow-hidden">
      ${state.accounts.length === 0 ? emptyState('wallet', 'No accounts', 'Accounts will appear after user registration.') : `
        <div class="overflow-x-auto"><table class="w-full">
          <thead class="bg-white/5"><tr class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider"><th class="px-6 py-3">Account Holder</th><th class="px-6 py-3">Account Number</th><th class="px-6 py-3">Type</th><th class="px-6 py-3">Balance</th><th class="px-6 py-3">Status</th></tr></thead>
          <tbody class="divide-y divide-white/5">
            ${state.accounts.map(a => {
              const user = state.users.find(u => u.id === a.user_id);
              return `<tr class="hover:bg-white/5 transition">
                <td class="px-6 py-4"><div class="flex items-center gap-3"><div class="w-9 h-9 gradient-brand rounded-full flex items-center justify-center text-white font-bold text-xs">${(user?.full_name || 'U').charAt(0).toUpperCase()}</div><div><div class="font-semibold text-white text-sm">${user?.full_name || 'Unknown'}</div><div class="text-xs text-slate-500">${user?.email || ''}</div></div></div></td>
                <td class="px-6 py-4 text-sm font-mono text-slate-300">${a.account_number}</td>
                <td class="px-6 py-4 text-sm text-slate-300 capitalize">${a.account_type}</td>
                <td class="px-6 py-4 text-sm font-display font-bold text-white">${fmt(a.balance)}</td>
                <td class="px-6 py-4"><span class="px-2 py-1 text-xs font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 capitalize">${a.status}</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>
      `}
    </div>
  `;
  lucide.createIcons();
}

// --- TRANSACTIONS ---
function renderTransactions() {
  $('#pageTitle').textContent = 'All Transactions';
  $('#pageSubtitle').textContent = `${state.transactions.length} total transactions`;
  let search = '', typeFilter = 'all', statusFilter = 'all';
  const render = () => {
    let list = [...state.transactions];
    if (search) list = list.filter(t => (t.description || '').toLowerCase().includes(search.toLowerCase()));
    if (typeFilter !== 'all') list = list.filter(t => t.type === typeFilter);
    if (statusFilter !== 'all') list = list.filter(t => t.status === statusFilter);
    $('#pageContent').innerHTML = `
      <div class="glass rounded-2xl overflow-hidden">
        <div class="p-6 border-b border-white/5 grid md:grid-cols-3 gap-3">
          <div class="relative md:col-span-2"><i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i><input id="txSearch" type="text" placeholder="Search..." value="${search}" class="input-field w-full pl-10 pr-4 py-2 rounded-xl text-sm"></div>
          <div class="flex gap-2">
            <select id="txType" class="input-field flex-1 px-3 py-2 rounded-xl text-sm"><option value="all" ${typeFilter==='all'?'selected':''}>All Types</option><option value="credit" ${typeFilter==='credit'?'selected':''}>Credit</option><option value="debit" ${typeFilter==='debit'?'selected':''}>Debit</option></select>
            <select id="txStatus" class="input-field flex-1 px-3 py-2 rounded-xl text-sm"><option value="all" ${statusFilter==='all'?'selected':''}>All Status</option><option value="completed" ${statusFilter==='completed'?'selected':''}>Completed</option><option value="pending" ${statusFilter==='pending'?'selected':''}>Pending</option></select>
          </div>
        </div>
        ${list.length === 0 ? emptyState('inbox', 'No transactions', 'Transactions will appear as users make them.') : `
          <div class="overflow-x-auto"><table class="w-full">
            <thead class="bg-white/5"><tr class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider"><th class="px-6 py-3">User</th><th class="px-6 py-3">Description</th><th class="px-6 py-3">Type</th><th class="px-6 py-3">Date</th><th class="px-6 py-3">Status</th><th class="px-6 py-3 text-right">Amount</th></tr></thead>
            <tbody class="divide-y divide-white/5">
              ${list.slice(0, 100).map(tx => {
                const user = state.users.find(u => u.id === tx.user_id);
                const isCredit = tx.type === 'credit';
                return `<tr class="hover:bg-white/5 transition">
                  <td class="px-6 py-4"><div class="flex items-center gap-2"><div class="w-8 h-8 gradient-brand rounded-full flex items-center justify-center text-white font-bold text-xs">${(user?.full_name || 'U').charAt(0).toUpperCase()}</div><div class="text-sm"><div class="font-semibold text-white">${user?.full_name || 'Unknown'}</div></div></div></td>
                  <td class="px-6 py-4 text-sm text-slate-300">${tx.description || '—'}</td>
                  <td class="px-6 py-4"><span class="text-xs font-medium text-slate-400 capitalize">${tx.type}</span></td>
                  <td class="px-6 py-4 text-xs text-slate-500">${fmtDate(tx.created_at)}</td>
                  <td class="px-6 py-4"><span class="px-2 py-1 text-xs font-semibold rounded-full ${tx.status === 'completed' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'} capitalize">${tx.status}</span></td>
                  <td class="px-6 py-4 text-right font-display font-bold text-sm ${isCredit ? 'text-emerald-400' : 'text-white'}">${isCredit ? '+' : '-'}${fmt(tx.amount)}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table></div>
        `}
      </div>
    `;
    lucide.createIcons();
    $('#txSearch').addEventListener('input', (e) => { search = e.target.value; render(); });
    $('#txType').addEventListener('change', (e) => { typeFilter = e.target.value; render(); });
    $('#txStatus').addEventListener('change', (e) => { statusFilter = e.target.value; render(); });
  };
  render();
}

// --- PENDING ---
function renderPending() {
  $('#pageTitle').textContent = 'Pending Requests';
  $('#pageSubtitle').textContent = `${state.pendingRequests.length} awaiting review`;
  $('#pageContent').innerHTML = `
    <div class="glass rounded-2xl overflow-hidden">
      ${state.pendingRequests.length === 0 ? emptyState('check-circle', 'All caught up!', 'No pending requests at this time.') : `
        <div class="overflow-x-auto"><table class="w-full">
          <thead class="bg-white/5"><tr class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider"><th class="px-6 py-3">User</th><th class="px-6 py-3">Type</th><th class="px-6 py-3">Description</th><th class="px-6 py-3">Amount</th><th class="px-6 py-3 text-right">Actions</th></tr></thead>
          <tbody class="divide-y divide-white/5">
            ${state.pendingRequests.map(tx => {
              const user = state.users.find(u => u.id === tx.user_id);
              const account = state.accounts.find(a => a.user_id === tx.user_id);
              return `<tr class="hover:bg-white/5 transition">
                <td class="px-6 py-4"><div class="flex items-center gap-2"><div class="w-8 h-8 gradient-brand rounded-full flex items-center justify-center text-white font-bold text-xs">${(user?.full_name || 'U').charAt(0).toUpperCase()}</div><div class="text-sm"><div class="font-semibold text-white">${user?.full_name || 'Unknown'}</div><div class="text-xs text-slate-500">Bal: ${fmt(account?.balance || 0)}</div></div></div></td>
                <td class="px-6 py-4"><span class="px-2 py-1 text-xs font-semibold rounded-full ${tx.type === 'credit' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'} capitalize">${tx.type}</span></td>
                <td class="px-6 py-4 text-sm text-slate-300">${tx.description || '—'}</td>
                <td class="px-6 py-4 font-display font-bold text-white">${fmt(tx.amount)}</td>
                <td class="px-6 py-4"><div class="flex gap-2 justify-end"><button onclick="approveTx('${tx.id}')" class="btn-approve px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i>Approve</button><button onclick="rejectTx('${tx.id}')" class="btn-reject px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1"><i data-lucide="x" class="w-3 h-3"></i>Reject</button></div></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>
      `}
    </div>
  `;
  lucide.createIcons();
}

window.approveTx = async (txId) => {
  const tx = state.transactions.find(t => t.id === txId);
  if (!tx) return;
  const user = state.users.find(u => u.id === tx.user_id);
  const account = state.accounts.find(a => a.user_id === tx.user_id);
  if (!account) { toast('Account not found', 'error'); return; }
  if ((tx.type === 'debit' || tx.type === 'transfer') && Number(account.balance) < Number(tx.amount)) { toast('Insufficient funds', 'error'); return; }
  if (!confirm(`Approve ${tx.type} of ${fmt(tx.amount)}?`)) return;
  try {
    let newBalance = Number(account.balance || 0);
    if (tx.type === 'credit') newBalance += Number(tx.amount); else newBalance -= Number(tx.amount);
    await sb.from('accounts').update({ balance: newBalance, available_balance: newBalance }).eq('id', account.id);
    await sb.from('transactions').update({ status: 'completed' }).eq('id', txId);
    toast('Transaction approved', 'success');
    await loadAllData(); renderPending();
  } catch (err) { toast(err.message, 'error'); }
};

window.rejectTx = async (txId) => {
  const tx = state.transactions.find(t => t.id === txId);
  if (!tx) return;
  if (!confirm(`Reject ${tx.type} of ${fmt(tx.amount)}?`)) return;
  try {
    await sb.from('transactions').update({ status: 'failed' }).eq('id', txId);
    toast('Transaction rejected', 'warning');
    await loadAllData(); renderPending();
  } catch (err) { toast(err.message, 'error'); }
};

// --- BROADCAST ---
function renderBroadcast() {
  $('#pageTitle').textContent = 'Broadcast Notification';
  $('#pageSubtitle').textContent = 'Send a message to all users';
  $('#pageContent').innerHTML = `
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 glass rounded-2xl p-6">
        <h3 class="font-display font-bold text-white mb-4">Compose Broadcast</h3>
        <form id="broadcastForm" class="space-y-4">
          <div><label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">TITLE</label><input type="text" id="bcTitle" required class="input-field w-full px-4 py-3 rounded-xl" placeholder="Important announcement"></div>
          <div><label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">MESSAGE</label><textarea id="bcMessage" required rows="6" class="input-field w-full px-4 py-3 rounded-xl resize-none" placeholder="Your message to all users..."></textarea></div>
          <button type="submit" id="bcBtn" class="btn-primary w-full py-3.5 rounded-xl flex items-center justify-center gap-2"><i data-lucide="send" class="w-4 h-4"></i> Send to All Users</button>
        </form>
      </div>
      <div class="glass rounded-2xl p-6 h-fit">
        <h3 class="font-display font-bold text-white mb-4">Broadcast Stats</h3>
        <div class="space-y-3">
          <div class="p-3 bg-white/5 rounded-xl"><div class="text-xs text-slate-400 mb-1">Total Users</div><div class="font-display text-xl font-bold text-white">${state.users.length}</div></div>
          <div class="p-3 bg-white/5 rounded-xl"><div class="text-xs text-slate-400 mb-1">Active Accounts</div><div class="font-display text-xl font-bold text-white">${state.accounts.filter(a => a.status === 'active').length}</div></div>
        </div>
      </div>
    </div>
  `;
  lucide.createIcons();
  $('#broadcastForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#bcBtn');
    btn.disabled = true; btn.innerHTML = '<div class="w-5 h-5 border-2 border-ink-950/30 border-t-ink-950 rounded-full animate-spin"></div>';
    try {
      const notifications = state.users.map(u => ({ user_id: u.id, title: $('#bcTitle').value, message: $('#bcMessage').value, type: 'info' }));
      await sb.from('notifications').insert(notifications);
      toast(`Broadcast sent to ${state.users.length} users`, 'success');
      $('#broadcastForm').reset();
    } catch (err) { toast(err.message, 'error'); }
    finally { btn.disabled = false; btn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> Send to All Users'; lucide.createIcons(); }
  });
}

// --- TICKETS ---
function renderTickets() {
  $('#pageTitle').textContent = 'Support Tickets';
  $('#pageSubtitle').textContent = `${state.tickets.length} total tickets`;
  $('#pageContent').innerHTML = `
    <div class="glass rounded-2xl overflow-hidden">
      ${state.tickets.length === 0 ? emptyState('life-buoy', 'No support tickets', 'User support requests will appear here.') : `
        <div class="divide-y divide-white/5">
          ${state.tickets.map(t => {
            const user = state.users.find(u => u.id === t.user_id);
            return `<div class="p-5 hover:bg-white/5 transition">
              <div class="flex items-start justify-between gap-4 mb-3">
                <div class="flex items-start gap-3 flex-1">
                  <div class="w-10 h-10 gradient-brand rounded-full flex items-center justify-center text-white font-bold text-sm flex-shrink-0">${(user?.full_name || 'U').charAt(0).toUpperCase()}</div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1 flex-wrap"><h4 class="font-semibold text-white">${t.subject}</h4><span class="px-2 py-0.5 text-xs font-semibold rounded-full capitalize ${t.status === 'open' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">${t.status}</span></div>
                    <p class="text-sm text-slate-400 mb-1">${t.message}</p>
                    <div class="text-xs text-slate-500">${user?.full_name || 'Unknown'} · ${fmtRelative(t.created_at)}</div>
                  </div>
                </div>
                <div class="flex gap-2 flex-shrink-0">${t.status !== 'resolved' ? `<button onclick="resolveTicket('${t.id}')" class="btn-approve px-3 py-1.5 rounded-lg text-xs font-semibold">Resolve</button>` : ''}</div>
              </div>
            </div>`;
          }).join('')}
        </div>
      `}
    </div>
  `;
  lucide.createIcons();
}

window.resolveTicket = async (id) => {
  await sb.from('support_tickets').update({ status: 'resolved', updated_at: new Date().toISOString() }).eq('id', id);
  toast('Ticket resolved', 'success');
  await loadAllData(); renderTickets();
};

  await loadAllData();
  renderShell('overview');

</script>
