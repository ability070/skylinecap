<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #232734; --border: #2e3345;
    --text: #e4e6f0; --text-dim: #8b8fa3; --accent: #6c5ce7; --accent2: #a29bfe;
    --green: #00cec9; --green-bg: rgba(0, 206, 201, 0.1);
    --red: #ff6b6b; --red-bg: rgba(255, 107, 107, 0.1);
    --yellow: #fdcb6e; --yellow-bg: rgba(253, 203, 110, 0.1);
    --gradient: linear-gradient(135deg, #6c5ce7, #a29bfe, #74b9ff);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
  .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px 16px; position: fixed; height: 100vh; }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
  .logo-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--gradient); display: grid; place-items: center; font-size: 18px; font-weight: 800; color: #fff; }
  .logo h1 { font-size: 18px; font-weight: 700; } .logo h1 span { color: var(--accent2); }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: var(--text-dim); font-size: 14px; cursor: pointer; margin-bottom: 4px; }
  .nav-item:hover { background: var(--surface2); color: var(--text); } .nav-item.active { background: rgba(108,92,231,0.15); color: var(--accent2); }
  .nav-item .icon { font-size: 18px; width: 24px; text-align: center; } .nav-item .badge-count { margin-left: auto; background: var(--red); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); margin-top: auto; position: absolute; bottom: 0; left: 0; right: 0; }
  .admin-trigger { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 8px; border-radius: 12px; }
  .admin-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gradient); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; }
  .admin-info { flex: 1; } .admin-info .name { font-size: 13px; font-weight: 600; } .admin-info .role { font-size: 11px; color: var(--text-dim); }
  .main { flex: 1; margin-left: 260px; padding: 32px 40px; }
  .top-bar { margin-bottom: 32px; } .top-bar h2 { font-size: 26px; font-weight: 700; }
  .view-section { display: none; } .view-section.active { display: block; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  .stat-card .label { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; } .stat-card .value { font-size: 28px; font-weight: 700; }
  .stat-card .value.green { color: var(--green); } .stat-card .value.yellow { color: var(--yellow); }
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px; margin-bottom: 24px; }
  .section-header { margin-bottom: 24px; } .section-header h3 { font-size: 18px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .status-badge.pending { background: var(--yellow-bg); color: var(--yellow); } .status-badge.approved { background: var(--green-bg); color: var(--green); } .status-badge.rejected { background: var(--red-bg); color: var(--red); }
  .type-badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; }
  .type-badge.deposit, .type-badge.loan { background: var(--green-bg); color: var(--green); } .type-badge.withdraw { background: var(--red-bg); color: var(--red); }
  .btn { padding: 10px 20px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-green { background: var(--green); color: #0f1117; } .btn-red { background: var(--red); color: #fff; }
  .customer-info { display: flex; align-items: center; gap: 12px; }
  .customer-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gradient); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
  .customer-details .name { font-weight: 600; } .customer-details .email { font-size: 12px; color: var(--text-dim); }
  .toast { position: fixed; bottom: 30px; right: 30px; background: var(--surface); border: 1px solid var(--border); padding: 16px 24px; border-radius: 14px; z-index: 200; transform: translateX(150%); transition: transform 0.4s; }
  .toast.show { transform: translateX(0); }
  .admin-login { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: grid; place-items: center; }
  .admin-login.hidden { display: none; }
  .admin-login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px; width: 100%; max-width: 420px; text-align: center; }
  .admin-login-logo { width: 72px; height: 72px; border-radius: 22px; background: var(--gradient); display: grid; place-items: center; font-size: 32px; font-weight: 800; color: #fff; margin: 0 auto 24px; }
  .admin-login-card h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; } .admin-login-card h1 span { color: var(--accent2); }
  .admin-login-card .tagline { color: var(--text-dim); font-size: 14px; margin-bottom: 32px; }
  .admin-login-card label { font-size: 13px; font-weight: 500; color: var(--text-dim); display: block; margin-bottom: 8px; text-align: left; }
  .admin-login-card input { width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 15px; outline: none; margin-bottom: 16px; }
  .admin-login-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--gradient); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  @media (max-width: 900px) { .sidebar { width: 80px; } .logo h1, .nav-item span:not(.badge-count), .admin-info { display: none; } .main { margin-left: 80px; padding: 24px 20px; } }
</style>
</head>
<body>
<div class="admin-login" id="adminLogin">
  <div class="admin-login-card">
    <div class="admin-login-logo">S</div>
    <h1><span>Skyline</span> Admin</h1>
    <p class="tagline">Secure administrator access</p>
    <label>Email</label><input type="email" id="adminUser" placeholder="admin@skyline.com">
    <label>Password</label><input type="password" id="adminPass" placeholder="••••••••">
    <button class="admin-login-btn" onclick="adminLogin()">Sign In</button>
  </div>
</div>

<aside class="sidebar" id="adminSidebar" style="display:none;">
  <div class="logo"><div class="logo-icon">S</div><h1>Sky<span>line</span></h1></div>
  <nav>
    <div class="nav-item active" onclick="switchView('dashboard', this)"><span class="icon">📊</span> <span>Dashboard</span></div>
    <div class="nav-item" onclick="switchView('customers', this)"><span class="icon">👥</span> <span>Customers</span></div>
    <div class="nav-item" onclick="switchView('pending', this)"><span class="icon">⏳</span> <span>Pending</span><span class="badge-count" id="pendingCount">0</span></div>
  </nav>
  <div class="sidebar-footer">
    <div class="admin-trigger" onclick="adminLogout()">
      <div class="admin-avatar">A</div>
      <div class="admin-info"><div class="name" id="adminNameDisplay">Admin</div><div class="role">Logout</div></div>
    </div>
  </div>
</aside>

<main class="main" id="adminMain" style="display:none;">
  <div class="top-bar"><h2 id="viewTitle">Dashboard Overview</h2></div>
  <div id="view-dashboard" class="view-section active">
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Total Customers</div><div class="value" id="statCustomers">0</div></div>
      <div class="stat-card"><div class="label">Total Balance</div><div class="value green" id="statBalance">$0.00</div></div>
      <div class="stat-card"><div class="label">Pending Requests</div><div class="value yellow" id="statPending">0</div></div>
    </div>
  </div>
  <div id="view-customers" class="view-section">
    <div class="section"><div class="section-header"><h3>All Customers</h3></div><table><thead><tr><th>Customer</th><th>Balance</th><th>Role</th></tr></thead><tbody id="customersTable"></tbody></table></div>
  </div>
  <div id="view-pending" class="view-section">
    <div class="section"><div class="section-header"><h3>Pending Requests</h3></div><table><thead><tr><th>Customer</th><th>Type</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody id="pendingTable"></tbody></table></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
  // ⚠️ REPLACE WITH YOUR SUPABASE CREDENTIALS
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allUsers = [];
  const fmt = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  async function checkAuth() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      document.getElementById('adminLogin').classList.remove('hidden');
      document.getElementById('adminSidebar').style.display = 'none';
      document.getElementById('adminMain').style.display = 'none';
      return;
    }
    const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
    if (!profile || profile.role !== 'admin') {
      alert('Admin access required');
      await sb.auth.signOut();
      window.location.href = 'index.html';
      return;
    }
    document.getElementById('adminLogin').classList.add('hidden');
    document.getElementById('adminSidebar').style.display = 'block';
    document.getElementById('adminMain').style.display = 'block';
    document.getElementById('adminNameDisplay').textContent = session.user.email.split('@')[0];
    loadData();
  }

  async function adminLogin() {
    const email = document.getElementById('adminUser').value;
    const password = document.getElementById('adminPass').value;
    await sb.auth.signInWithPassword({ email, password });
    checkAuth();
  }

  async function adminLogout() {
    if (!confirm('Logout?')) return;
    await sb.auth.signOut();
    window.location.href = 'index.html';
  }

  async function loadData() {
    const { data: users } = await sb.from('profiles').select('*');
    allUsers = users || [];
    document.getElementById('statCustomers').textContent = allUsers.length;
    document.getElementById('statBalance').textContent = fmt(allUsers.reduce((sum, c) => sum + Number(c.balance || 0), 0));
    renderCustomers();

    const { data: pending } = await sb.from('requests').select('*').eq('status', 'pending').order('created_at', { ascending: false });
    renderPending(pending || []);
    document.getElementById('pendingCount').textContent = (pending || []).length;
    document.getElementById('statPending').textContent = (pending || []).length;
  }

  async function approveRequest(req) {
    if (!confirm('Approve?')) return;
    const user = allUsers.find(u => u.id === req.user_id);
    let newBalance = Number(user.balance || 0);
    if (req.type === 'deposit' || req.type === 'loan') newBalance += Number(req.amount);
    else if (req.type === 'withdraw') {
      if (newBalance < Number(req.amount)) { showToast('Insufficient funds', 'red'); return; }
      newBalance -= Number(req.amount);
    }
    await sb.from('profiles').update({ balance: newBalance }).eq('id', req.user_id);
    await sb.from('requests').update({ status: 'approved' }).eq('id', req.id);
    await sb.from('transactions').insert({ user_id: req.user_id, type: req.type, amount: req.amount, status: 'approved' });
    showToast('Approved!', 'green');
    loadData();
  }

  async function rejectRequest(reqId) {
    if (!confirm('Reject?')) return;
    await sb.from('requests').update({ status: 'rejected' }).eq('id', reqId);
    showToast('Rejected', 'red');
    loadData();
  }

  function renderCustomers() {
    document.getElementById('customersTable').innerHTML = allUsers.map(c => `<tr><td><div class="customer-info"><div class="customer-avatar">${(c.full_name||'U').charAt(0)}</div><div class="customer-details"><div class="name">${c.full_name || 'Unknown'}</div><div class="email">${c.email}</div></div></div></td><td style="font-weight:600;color:var(--green);">${fmt(c.balance)}</td><td><span class="status-badge approved">${c.role}</span></td></tr>`).join('');
  }

  function renderPending(pendingReqs) {
    document.getElementById('pendingTable').innerHTML = pendingReqs.length === 0 ? `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-dim);">No pending requests</td></tr>` : pendingReqs.map(req => {
      const user = allUsers.find(c => c.id === req.user_id) || { full_name: 'Unknown', email: 'unknown@example.com' };
      return `<tr><td><div class="customer-info"><div class="customer-avatar">${(user.full_name||'U').charAt(0)}</div><div class="customer-details"><div class="name">${user.full_name}</div><div class="email">${user.email}</div></div></div></td><td><span class="type-badge ${req.type}">${req.type.toUpperCase()}</span></td><td style="font-weight:600;">${fmt(req.amount)}</td><td><span class="status-badge pending">Pending</span></td><td><button class="btn btn-green" onclick='approveRequest(${JSON.stringify(req)})'>✓</button> <button class="btn btn-red" onclick="rejectRequest('${req.id}')">✕</button></td></tr>`;
    }).join('');
  }

  function showToast(msg, color) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.borderLeft = `4px solid var(--${color})`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function switchView(viewName, navElement) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.getElementById('view-' + viewName).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    if (navElement) navElement.classList.add('active');
    const titles = { dashboard: 'Dashboard Overview', customers: 'Customers', pending: 'Pending Requests' };
    document.getElementById('viewTitle').textContent = titles[viewName];
  }

  checkAuth();
</script>
</body>
</html>
