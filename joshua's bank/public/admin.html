const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const fmtDateTime = (d) => d ? new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const fmtRelative = (d) => {
  if (!d) return '';
  const diff = (Date.now() - new Date(d)) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return fmtDate(d);
};

// ============ TOAST ============
function toast(message, type = 'info') {
  const colors = { success: 'from-emerald-500 to-teal-500', error: 'from-rose-500 to-red-500', info: 'from-sky-500 to-blue-500', warning: 'from-amber-500 to-orange-500' };
  const icons = { success: 'check-circle-2', error: 'x-circle', info: 'info', warning: 'alert-triangle' };
  const el = document.createElement('div');
  el.className = `slide-in-right pointer-events-auto flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-white bg-gradient-to-r ${colors[type]} min-w-[280px] max-w-md border border-white/10`;
  el.innerHTML = `<i data-lucide="${icons[type]}" class="w-5 h-5 flex-shrink-0"></i><span class="text-sm font-medium flex-1">${message}</span><button onclick="this.parentElement.remove()" class="opacity-60 hover:opacity-100"><i data-lucide="x" class="w-4 h-4"></i></button>`;
  $('#toastContainer').appendChild(el);
  lucide.createIcons();
  setTimeout(() => { el.style.transition = 'all 0.3s'; el.style.opacity = '0'; el.style.transform = 'translateX(120%)'; setTimeout(() => el.remove(), 300); }, 4000);
}

// ============ AUTH CHECK ============
async function checkAuth() {
  if (!sb || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    renderSetupScreen();
    return;
  }
  
  const { data: { session } } = await sb.auth.getSession();
  
  // DEBUG: Log session info
  console.log('=== DEBUG: Session Info ===');
  console.log('Session exists:', !!session);
  if (session) {
    console.log('User ID:', session.user.id);
    console.log('User Email:', session.user.email);
    console.log('Email confirmed:', session.user.email_confirmed_at);
  }
  
  if (!session) { 
    renderLogin(); 
    return; 
  }

  // Query the profile
  const { data: profile, error: profileError } = await sb
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .maybeSingle();
  
  // DEBUG: Log profile query result
  console.log('=== DEBUG: Profile Query ===');
  console.log('Profile data:', profile);
  console.log('Profile error:', profileError);
  console.log('Profile role:', profile?.role);
  console.log('Profile email:', profile?.email);
  
  // Also check what the auth user email is vs profile email
  console.log('=== DEBUG: Email Comparison ===');
  console.log('Auth email:', session.user.email);
  console.log('Profile email:', profile?.email);
  console.log('Emails match:', session.user.email === profile?.email);

  // Check ALL profiles to see if user exists at all
  const { data: allProfiles } = await sb.from('profiles').select('id, email, role');
  console.log('=== DEBUG: All Profiles in DB ===');
  console.log(allProfiles);
  console.log('Found profile with matching email:', 
    allProfiles?.find(p => p.email === session.user.email));

  if (!profile) {
    console.error('❌ Profile is NULL - RLS might be blocking or profile does not exist');
    await sb.auth.signOut();
    renderUnauthorizedDebug('Profile not found', profileError?.message || 'No profile returned from database');
    return;
  }
  
  if (profile.role !== 'admin') {
    console.error('❌ Role is not admin:', profile.role);
    await sb.auth.signOut();
    renderUnauthorizedDebug('Not an admin', `Your role is "${profile.role}", not "admin"`);
    return;
  }

  console.log('✅ Auth check passed! Loading admin dashboard...');
  state.admin = session.user;
  state.profile = profile;
  await loadAllData();
  renderShell('overview');
}

async function loadAllData() {
  const [users, accounts, transactions, tickets, notifications] = await Promise.all([
    sb.from('profiles').select('*').order('created_at', { ascending: false }),
    sb.from('accounts').select('*'),
    sb.from('transactions').select('*').order('created_at', { ascending: false }).limit(500),
    sb.from('support_tickets').select('*').order('created_at', { ascending: false }),
    sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(100)
  ]);
  state.users = users.data || [];
  state.accounts = accounts.data || [];
  state.transactions = transactions.data || [];
  state.tickets = tickets.data || [];
  state.notifications = notifications.data || [];
  state.pendingRequests = state.transactions.filter(t => t.status === 'pending');
}

function renderVolumeChart() {
  const ctx = $('#volumeChart');
  if (!ctx) return;
  if (state.charts.volume) state.charts.volume.destroy();

  // Group by last 7 days
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push({ date: d.toISOString().split('T')[0], label: d.toLocaleDateString('en-US', { weekday: 'short' }), income: 0, expense: 0 });
  }
  state.transactions.forEach(tx => {
    const txDate = new Date(tx.created_at).toISOString().split('T')[0];
    const day = days.find(d => d.date === txDate);
    if (day) {
      if (tx.type === 'credit') day.income += Number(tx.amount);
      else day.expense += Number(tx.amount);
    }
  });

  state.charts.volume = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: days.map(d => d.label),
      datasets: [
        { label: 'Income', data: days.map(d => d.income), backgroundColor: '#10B981', borderRadius: 6 },
        { label: 'Expenses', data: days.map(d => d.expense), backgroundColor: '#EF4444', borderRadius: 6 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#94A3B8' } }, tooltip: { callbacks: { label: (c) => c.dataset.label + ': ' + fmt(c.parsed.y) } } },
      scales: {
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748B', callback: v => '$' + (v >= 1000 ? (v/1000).toFixed(1) + 'k' : v) } },
        x: { grid: { display: false }, ticks: { color: '#64748B' } }
      }
    }
  });
}

window.openAdjustBalance = (userId) => {
  const user = state.users.find(u => u.user_id === userId);
  const account = state.accounts.find(a => a.user_id === userId);
  if (!user || !account) return;

  openModal(`
    <div class="flex items-center justify-between mb-6">
      <h3 class="font-display text-xl font-bold text-white">Adjust Balance</h3>
      <button onclick="closeModal()" class="p-1 hover:bg-white/10 rounded-lg"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
    </div>
    <div class="p-4 bg-white/5 rounded-xl border border-white/5 mb-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 gradient-brand rounded-full flex items-center justify-center text-white font-bold">${(user.full_name || 'U').charAt(0).toUpperCase()}</div>
        <div><div class="font-semibold text-white">${user.full_name}</div><div class="text-xs text-slate-400">Current: ${fmt(account.balance)}</div></div>
      </div>
    </div>
    <form id="adjustForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">ACTION</label>
        <select id="adjAction" class="input-field w-full px-4 py-2.5 rounded-xl">
          <option value="add">Add Funds (Credit)</option>
          <option value="remove">Remove Funds (Debit)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">AMOUNT (USD)</label>
        <input type="number" id="adjAmount" required min="0.01" step="0.01" class="input-field w-full px-4 py-2.5 rounded-xl font-display font-bold text-lg" placeholder="0.00">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">REASON</label>
        <input type="text" id="adjReason" required class="input-field w-full px-4 py-2.5 rounded-xl" placeholder="Admin adjustment">
      </div>
      <button type="submit" class="btn-primary w-full py-3 rounded-xl">Apply Adjustment</button>
    </form>
  `);

  $('#adjustForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const action = $('#adjAction').value;
    const amount = parseFloat($('#adjAmount').value);
    const reason = $('#adjReason').value;
    const currentBalance = Number(account.balance || 0);
    const newBalance = action === 'add' ? currentBalance + amount : currentBalance - amount;

    if (action === 'remove' && newBalance < 0) { toast('Insufficient funds', 'error'); return; }

    try {
      await sb.from('accounts').update({ balance: newBalance, available_balance: newBalance }).eq('id', account.id);
      await sb.from('transactions').insert({
        user_id: userId, account_id: account.id,
        type: action === 'add' ? 'credit' : 'debit',
        category: 'admin', description: `Admin: ${reason}`,
        amount: amount, currency: 'USD',
        reference: 'ADJ' + Date.now().toString().slice(-8),
        status: 'completed'
      });
      await sb.from('notifications').insert({
        user_id: userId,
        title: action === 'add' ? 'Funds Added' : 'Funds Removed',
        message: `${fmt(amount)} has been ${action === 'add' ? 'added to' : 'removed from'} your account. Reason: ${reason}`,
        type: 'info'
      });
      await logAudit('balance_adjust', `${action} ${fmt(amount)} for ${user.full_name}: ${reason}`);
      toast('Balance adjusted', 'success');
      closeModal();
      await loadAllData();
      renderUsers();
    } catch (err) { toast(err.message, 'error'); }
  });
};

window.openUserDetail = (userId) => {
  const user = state.users.find(u => u.user_id === userId);

window.approveTx = async (txId) => {
  const tx = state.transactions.find(t => t.id === txId);
  if (!tx) return;
  const user = state.users.find(u => u.user_id === tx.user_id);
  const account = state.accounts.find(a => a.user_id === tx.user_id);
  if (!account) { toast('Account not found', 'error'); return; }

  if (tx.type === 'debit' || tx.type === 'transfer') {
    if (Number(account.balance) < Number(tx.amount)) {
      toast('Insufficient funds to approve', 'error');
      return;
    }
  }

  if (!confirm(`Approve ${tx.type} of ${fmt(tx.amount)} for ${user?.full_name}?`)) return;

  try {
    let newBalance = Number(account.balance || 0);
    if (tx.type === 'credit') newBalance += Number(tx.amount);
    else newBalance -= Number(tx.amount);

    await sb.from('accounts').update({ balance: newBalance, available_balance: newBalance }).eq('id', account.id);
    await sb.from('transactions').update({ status: 'completed' }).eq('id', txId);
    await sb.from('notifications').insert({
      user_id: tx.user_id,
      title: 'Transaction Approved',
      message: `Your ${tx.type} of ${fmt(tx.amount)} has been approved.`,
      type: 'success'
    });
    await logAudit('tx_approved', `Approved ${tx.type} ${fmt(tx.amount)} for ${user?.full_name}`);
    toast('Transaction approved', 'success');
    await loadAllData();
    renderPending();
  } catch (err) { toast(err.message, 'error'); }
};

window.rejectTx = async (txId) => {
  const tx = state.transactions.find(t => t.id === txId);
  if (!tx) return;
  const user = state.users.find(u => u.user_id === tx.user_id);
  if (!confirm(`Reject ${tx.type} of ${fmt(tx.amount)} for ${user?.full_name}?`)) return;

  try {
    await sb.from('transactions').update({ status: 'failed' }).eq('id', txId);
    await sb.from('notifications').insert({
      user_id: tx.user_id,
      title: 'Transaction Rejected',
      message: `Your ${tx.type} of ${fmt(tx.amount)} has been rejected.`,
      type: 'error'
    });
    await logAudit('tx_rejected', `Rejected ${tx.type} ${fmt(tx.amount)} for ${user?.full_name}`);
    toast('Transaction rejected', 'warning');
    await loadAllData();
    renderPending();
  } catch (err) { toast(err.message, 'error'); }
};

  $('#replyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const resolve = $('#rpResolve').checked;
    await sb.from('notifications').insert({
      user_id: ticket.user_id,
      title: 'Support Reply',
      message: `Re: ${ticket.subject}\n\n${$('#rpMessage').value}`,
      type: 'info'
    });
    if (resolve) {
      await sb.from('support_tickets').update({ status: 'resolved', updated_at: new Date().toISOString() }).eq('id', id);
    }
    await logAudit('ticket_reply', `Replied to ticket: ${ticket.subject}`);
    toast('Reply sent', 'success');
    closeModal();
    await loadAllData();
    renderTickets();
  });
};

// ============ BROADCAST ============
function renderBroadcast() {
  $('#pageTitle').textContent = 'Broadcast Notification';
  $('#pageSubtitle').textContent = 'Send a message to all users';

  $('#pageContent').innerHTML = `
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 glass rounded-2xl p-6">
        <h3 class="font-display font-bold text-white mb-4">Compose Broadcast</h3>
        <form id="broadcastForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">TITLE</label>
            <input type="text" id="bcTitle" required class="input-field w-full px-4 py-3 rounded-xl" placeholder="Important announcement">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">MESSAGE</label>
            <textarea id="bcMessage" required rows="6" class="input-field w-full px-4 py-3 rounded-xl resize-none" placeholder="Your message to all users..."></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">TYPE</label>
            <select id="bcType" class="input-field w-full px-4 py-3 rounded-xl">
              <option value="info">Info</option>
              <option value="success">Success</option>
              <option value="warning">Warning</option>
              <option value="error">Alert</option>
            </select>
          </div>
          <div class="p-4 bg-amber-500/10 border border-amber-500/20 rounded-xl flex items-start gap-2">
            <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400 flex-shrink-0 mt-0.5"></i>
            <div class="text-xs text-amber-200">This will send a notification to all <strong>${state.users.length}</strong> registered users.</div>
          </div>
          <button type="submit" id="bcBtn" class="btn-primary w-full py-3.5 rounded-xl flex items-center justify-center gap-2">
            <i data-lucide="send" class="w-4 h-4"></i> Send to All Users
          </button>
        </form>
      </div>
      <div class="glass rounded-2xl p-6 h-fit">
        <h3 class="font-display font-bold text-white mb-4">Broadcast Stats</h3>
        <div class="space-y-3">
          <div class="p-3 bg-white/5 rounded-xl"><div class="text-xs text-slate-400 mb-1">Total Users</div><div class="font-display text-xl font-bold text-white">${state.users.length}</div></div>
          <div class="p-3 bg-white/5 rounded-xl"><div class="text-xs text-slate-400 mb-1">Active Accounts</div><div class="font-display text-xl font-bold text-white">${state.accounts.filter(a => a.status === 'active').length}</div></div>
          <div class="p-3 bg-white/5 rounded-xl"><div class="text-xs text-slate-400 mb-1">Recent Notifications</div><div class="font-display text-xl font-bold text-white">${state.notifications.length}</div></div>
        </div>
      </div>
    </div>
  `;
  lucide.createIcons();

  $('#broadcastForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#bcBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="w-5 h-5 border-2 border-ink-950/30 border-t-ink-950 rounded-full animate-spin"></div>';

    const title = $('#bcTitle').value;
    const message = $('#bcMessage').value;
    const type = $('#bcType').value;

    try {
      const notifications = state.users.map(u => ({
        user_id: u.user_id, title, message, type
      }));
      const { error } = await sb.from('notifications').insert(notifications);
      if (error) throw error;
      await logAudit('broadcast', `Sent broadcast "${title}" to ${state.users.length} users`);
      toast(`Broadcast sent to ${state.users.length} users`, 'success');
      $('#broadcastForm').reset();
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> Send to All Users';
      lucide.createIcons();
    }
  });
}

// ============ AUDIT LOG ============
function renderAudit() {
  $('#pageTitle').textContent = 'Audit Log';
  $('#pageSubtitle').textContent = 'Admin activity history';

  $('#pageContent').innerHTML = `
    <div class="glass rounded-2xl overflow-hidden">
      <div class="p-6 border-b border-white/5 flex items-center justify-between">
        <div><h3 class="font-display font-bold text-white">Activity Log</h3><p class="text-xs text-slate-400">Track all admin actions</p></div>
      </div>
      <div id="auditContent">
        <div class="p-12 text-center"><div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin mx-auto mb-3"></div><p class="text-sm text-slate-400">Loading audit log...</p></div>
      </div>
    </div>
  `;
  lucide.createIcons();

  sb.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(100).then(({ data }) => {
    const logs = data || [];
    $('#auditContent').innerHTML = logs.length === 0 ? emptyState('scroll-text', 'No audit logs yet', 'Admin actions will be recorded here.') : `
      <div class="divide-y divide-white/5">
        ${logs.map(log => {
          const admin = state.users.find(u => u.user_id === log.user_id);
          return `
            <div class="p-4 hover:bg-white/5 transition flex items-start gap-4">
              <div class="w-10 h-10 gradient-admin rounded-xl flex items-center justify-center flex-shrink-0">
                <i data-lucide="shield" class="w-5 h-5 text-white"></i>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                  <span class="font-semibold text-white text-sm">${admin?.full_name || 'Admin'}</span>
                  <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-brand-gold/10 text-brand-gold border border-brand-gold/20">${log.action}</span>
                </div>
                <p class="text-sm text-slate-400">${log.description}</p>
                <div class="text-xs text-slate-500 mt-1">${fmtDateTime(log.created_at)}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
    lucide.createIcons();
  });
}

window.addEventListener('DOMContentLoaded', checkAuth);
</script>
