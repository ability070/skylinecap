<style>

  /* Glassmorphism */

    -webkit-backdrop-filter: blur(24px);

  .glass-strong {

    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .glass-light {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(226, 232, 240, 0.5);
  }

  /* Gradients */
  .gradient-brand { background: linear-gradient(135deg, #22D3EE 0%, #3B82F6 50%, #6366F1 100%); }
  .gradient-ink { background: linear-gradient(180deg, #0A1128 0%, #050B1F 100%); }
  .gradient-card { background: linear-gradient(135deg, #1A2650 0%, #0F1A3A 100%); }

  /* Animations */
  .fade-in { animation: fadeIn 0.5s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .slide-up { animation: slideUp 0.4s ease-out; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .slide-in-right { animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes slideInRight { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .scale-in { animation: scaleIn 0.3s ease-out; }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .pulse-glow { animation: pulseGlow 3s ease-in-out infinite; }
  @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 40px -10px rgba(34, 211, 238, 0.4); } 50% { box-shadow: 0 0 60px -5px rgba(34, 211, 238, 0.6); } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }

  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  /* Input */
  .input-field {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #E2E8F0;
    transition: all 0.2s;

  .nav-item.active {

  }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 3px;
    background: linear-gradient(180deg, #22D3EE, #3B82F6);
    border-radius: 0 3px 3px 0;

  /* Buttons */
  .btn-primary {
    background: linear-gradient(135deg, #22D3EE 0%, #3B82F6 100%);
    color: white;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn-primary:hover {

  .btn-primary:active { transform: translateY(0); }

  /* Card shine */
  .card-shine { position: relative; overflow: hidden; }
  .card-shine::before {
    content: '';

    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.08) 50%, transparent 70%);

    .sidebar-desktop { transform: translateX(-100%); transition: transform 0.3s; position: fixed; z-index: 50; }

// ============ UTILITIES ============
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const fmt = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const fmtDateTime = (d) => d ? new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const fmtRelative = (d) => {
  if (!d) return '';
  const diff = (Date.now() - new Date(d)) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return fmtDate(d);
};
const maskAccount = (n) => n ? '•••• •••• •••• ' + String(n).slice(-4) : '•••• •••• •••• ••••';

// ============ TOAST ============
function toast(message, type = 'info') {
  const colors = {
    success: 'from-emerald-500 to-teal-500',
    error: 'from-rose-500 to-red-500',
    info: 'from-sky-500 to-blue-500',
    warning: 'from-amber-500 to-orange-500'
  };
  const icons = { success: 'check-circle-2', error: 'x-circle', info: 'info', warning: 'alert-triangle' };
  const el = document.createElement('div');
  el.className = `toast-enter pointer-events-auto flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-white bg-gradient-to-r ${colors[type]} min-w-[280px] max-w-md border border-white/10`;
  el.innerHTML = `
    <i data-lucide="${icons[type]}" class="w-5 h-5 flex-shrink-0"></i>
    <span class="text-sm font-medium flex-1">${message}</span>
    <button onclick="this.parentElement.remove()" class="opacity-60 hover:opacity-100"><i data-lucide="x" class="w-4 h-4"></i></button>
  `;
  $('#toastContainer').appendChild(el);
  lucide.createIcons();
  setTimeout(() => {
    el.style.transition = 'all 0.3s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(120%)';
    setTimeout(() => el.remove(), 300);
  }, 4000);
}

// ============ MODAL ============
function openModal(html) {
  $('#modalContent').innerHTML = html;
  $('#modalContainer').classList.remove('hidden');
  $('#modalContainer').classList.add('flex');
  lucide.createIcons();
}
function closeModal() {
  $('#modalContainer').classList.add('hidden');
  $('#modalContainer').classList.remove('flex');
}
$('#modalContainer').addEventListener('click', (e) => {
  if (e.target.id === 'modalContainer') closeModal();
});

  </div>
`;

const skeleton = (cls = '') => `<div class="skeleton ${cls}"></div>`;

// ============ ROUTER ============
const routes = {
  '': 'landing', '/': 'landing',
  '/login': 'login', '/signup': 'signup',
  '/forgot-password': 'forgot', '/reset-password': 'reset',
  '/dashboard': 'dashboard', '/accounts': 'accounts',
  '/transactions': 'transactions', '/cards': 'cards',
  '/transfers': 'transfers', '/payments': 'payments',
  '/beneficiaries': 'beneficiaries', '/statements': 'statements',
  '/notifications': 'notifications', '/profile': 'profile',
  '/security': 'security', '/support': 'support'
};
const protectedRoutes = ['dashboard','accounts','transactions','cards','transfers','payments','beneficiaries','statements','notifications','profile','security','support'];
const authRoutes = ['login','signup','forgot','reset'];

function navigate(path) { window.location.hash = path; }
function getRoute() { return routes[window.location.hash.slice(1) || '/'] || 'landing'; }

async function router() {
  if (!sb || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    renderSetupScreen();
    return;
  }
  const route = getRoute();
  state.currentRoute = route;

  const { data: { session } } = await sb.auth.getSession();
  state.user = session?.user || null;

  if (protectedRoutes.includes(route) && !state.user) {
    toast('Please sign in to continue', 'info');
    navigate('/login');
    return;
  }
  if (authRoutes.includes(route) && state.user) { navigate('/dashboard'); return; }
  if (route === 'landing' && state.user) { navigate('/dashboard'); return; }

  if (protectedRoutes.includes(route) && state.user) {
    await loadUserData();
  }

  render(route);
}

window.addEventListener('hashchange', router);

// ============ DATA LOADING ============
async function loadUserData() {
  if (!state.user) return;
  const uid = state.user.id;
  const [p, a, t, c, b, n, s] = await Promise.all([
    sb.from('profiles').select('*').eq('user_id', uid).maybeSingle(),
    sb.from('accounts').select('*').eq('user_id', uid),
    sb.from('transactions').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(100),
    sb.from('cards').select('*').eq('user_id', uid),
    sb.from('beneficiaries').select('*').eq('user_id', uid).order('created_at', { ascending: false }),
    sb.from('notifications').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(50),
    sb.from('support_tickets').select('*').eq('user_id', uid).order('created_at', { ascending: false })
  ]);
  state.profile = p.data;
  state.accounts = a.data || [];
  state.transactions = t.data || [];
  state.cards = c.data || [];
  state.beneficiaries = b.data || [];
  state.notifications = n.data || [];
  state.tickets = s.data || [];
}

    forgot: renderForgot,

    transfers: () => renderShell(renderTransfers),
    payments: () => renderShell(renderPayments),
    beneficiaries: () => renderShell(renderBeneficiaries),
    statements: () => renderShell(renderStatements),
    notifications: () => renderShell(renderNotifications),
    profile: () => renderShell(renderProfile),
    security: () => renderShell(renderSecurity),
    support: () => renderShell(renderSupport)
  };
  (renderers[route] || renderLanding)();
  lucide.createIcons();
}

function renderMarketChart() {
  const ctx = $('#marketChart');
  if (!ctx) return;
  if (state.charts.market) state.charts.market.destroy();
  state.charts.market = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
      datasets: [{
        label: 'S&P 500 (Illustrative)',
        data: [4200, 4320, 4280, 4450, 4520, 4480, 4600, 4550, 4680, 4720, 4750, 4783],
        borderColor: '#22D3EE',
        backgroundColor: (ctx) => {
          const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 320);
          g.addColorStop(0, 'rgba(34, 211, 238, 0.3)');
          g.addColorStop(1, 'rgba(34, 211, 238, 0)');
          return g;
        },
        fill: true, tension: 0.4, borderWidth: 3,
        pointBackgroundColor: '#22D3EE', pointRadius: 0, pointHoverRadius: 6
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(10, 17, 40, 0.9)',
          borderColor: 'rgba(34, 211, 238, 0.3)',
          borderWidth: 1,
          titleColor: '#E2E8F0',
          bodyColor: '#22D3EE',
          padding: 12,
          cornerRadius: 8
        }
      },
      scales: {
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748B', callback: v => '$' + v } },
        x: { grid: { display: false }, ticks: { color: '#64748B' } }
      }
    }
  });
}

function authShell(title, subtitle, icon, content, footer) {
  return `

      <div class="orb w-96 h-96 bg-brand-cyan -top-20 -left-20"></div>

        <a href="#/" class="flex items-center justify-center gap-3 mb-8">
          <div class="w-12 h-12 gradient-brand rounded-xl flex items-center justify-center pulse-glow">
            <i data-lucide="landmark" class="w-6 h-6 text-white"></i>
          </div>
          <div>
            <div class="font-display font-bold text-white text-xl leading-none">SKYLINE</div>
            <div class="text-[10px] tracking-[0.3em] text-brand-cyan font-semibold">CAPITAL</div>
          </div>
        </a>
        <div class="glass-strong rounded-3xl p-8 shadow-2xl">
          <div class="text-center mb-8">
            <div class="w-16 h-16 gradient-brand rounded-2xl flex items-center justify-center mx-auto mb-4">
              <i data-lucide="${icon}" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="font-display text-2xl font-bold text-white mb-2">${title}</h1>
            <p class="text-slate-400 text-sm">${subtitle}</p>
          </div>
          <div id="authAlert" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-sm flex items-start gap-2">

          <div class="mt-6 text-center text-sm text-slate-400">${footer}</div>

        <div class="text-center mt-6 text-xs text-slate-500">
          Banking Beyond Boundaries · © 2026 Skyline Capital
        </div>
      </div>
    </div>
  `;
}

function showAuthError(msg) {
  $('#authAlertText').textContent = msg;
  $('#authAlert').classList.remove('hidden');
  lucide.createIcons();
}
function hideAuthError() { $('#authAlert').classList.add('hidden'); }

      <button type="submit" id="resetBtn" class="btn-primary w-full font-semibold py-3.5 rounded-xl">Update Password</button>
    </form>`,
    ''
  );
  lucide.createIcons();

  $('#resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = $('#resetPw').value;
    const confirm = $('#resetConfirm').value;
    if (pw !== confirm) { showAuthError('Passwords do not match'); return; }
    const btn = $('#resetBtn');
    btn.disabled = true;
    btn.textContent = 'Updating...';
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) {

      btn.disabled = false;
      btn.textContent = 'Update Password';
    } else {
      toast('Password updated! Please sign in.', 'success');
      setTimeout(() => navigate('/login'), 1500);
    }
  });
}

function renderBalanceChart() {
  const ctx = $('#balanceChart');
  if (!ctx) return;
  if (state.charts.balance) state.charts.balance.destroy();

  // Build running balance from oldest to newest
  const sorted = [...state.transactions].reverse();
  let running = 0;
  const data = sorted.map(tx => {
    running += tx.type === 'credit' ? Number(tx.amount) : -Number(tx.amount);
    return running;
  });
  const labels = sorted.map(tx => fmtDate(tx.created_at));

  state.charts.balance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Balance',
        data,
        borderColor: '#22D3EE',
        backgroundColor: (ctx) => {
          const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 250);
          g.addColorStop(0, 'rgba(34, 211, 238, 0.3)');
          g.addColorStop(1, 'rgba(34, 211, 238, 0)');
          return g;
        },
        fill: true, tension: 0.4, borderWidth: 2.5,
        pointBackgroundColor: '#22D3EE', pointRadius: 0, pointHoverRadius: 5
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(10,17,40,0.9)', borderColor: 'rgba(34,211,238,0.3)', borderWidth: 1, callbacks: { label: (c) => fmt(c.parsed.y) } } },
      scales: {
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748B', callback: v => '$' + (v >= 1000 ? (v/1000).toFixed(1) + 'k' : v) } },
        x: { grid: { display: false }, ticks: { color: '#64748B', maxTicksLimit: 6 } }
      }
    }
  });
}

window.executeTransfer = async (amount, benId, desc) => {
  const ben = state.beneficiaries.find(b => b.id === benId);
  const reference = 'TRF' + Date.now().toString().slice(-8);
  closeModal();
  toast('Processing transfer...', 'info');

  const { error } = await sb.from('transactions').insert({
    user_id: state.user.id,
    account_id: state.accounts[0]?.id,
    type: 'transfer',
    category: 'transfer',
    description: desc || `Transfer to ${ben.name}`,
    amount: amount,
    currency: 'USD',
    reference: reference,
    status: 'completed'
  });

  if (error) { toast('Transfer failed: ' + error.message, 'error'); return; }

  // Update balance (simulation)
  const currentBalance = Number(state.accounts[0]?.balance || 0);
  await sb.from('accounts').update({
    balance: currentBalance - amount,
    available_balance: Math.max(0, Number(state.accounts[0]?.available_balance || 0) - amount)
  }).eq('id', state.accounts[0]?.id);

  openModal(`
    <div class="text-center">
      <div class="w-20 h-20 bg-emerald-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/20">
        <i data-lucide="check-circle-2" class="w-10 h-10 text-emerald-400"></i>
      </div>
      <h3 class="font-display text-2xl font-bold text-white mb-2">Transfer Submitted</h3>
      <p class="text-slate-400 mb-6 text-sm">This is a simulation. No real money has moved.</p>
      <div class="bg-white/5 rounded-xl p-4 mb-6 text-left space-y-2 border border-white/5">
        <div class="flex justify-between text-sm"><span class="text-slate-400">Amount</span><span class="font-display font-bold text-white">${fmt(amount)}</span></div>
        <div class="flex justify-between text-sm"><span class="text-slate-400">To</span><span class="font-semibold text-white">${ben.name}</span></div>
        <div class="flex justify-between text-sm"><span class="text-slate-400">Reference</span><span class="font-mono font-semibold text-white">${reference}</span></div>
      </div>
      <button onclick="closeModal(); navigate('/transactions');" class="btn-primary w-full py-3 rounded-xl font-semibold">View Transactions</button>
    </div>
  `);
  lucide.createIcons();
  await loadUserData();
};

        <div class="divide-y divide-white/5">
          ${state.notifications.map(n => `
            <div class="p-5 hover:bg-white/5 transition flex items-start gap-4 ${!n.is_read ? 'bg-brand-cyan/5' : ''}">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${n.type === 'success' ? 'bg-emerald-500/10' : n.type === 'warning' ? 'bg-amber-500/10' : n.type === 'error' ? 'bg-rose-500/10' : 'bg-brand-cyan/10'}">
                <i data-lucide="${n.type === 'success' ? 'check-circle-2' : n.type === 'warning' ? 'alert-triangle' : n.type === 'error' ? 'x-circle' : 'info'}" class="w-5 h-5 ${n.type === 'success' ? 'text-emerald-400' : n.type === 'warning' ? 'text-amber-400' : n.type === 'error' ? 'text-rose-400' : 'text-brand-cyan'}"></i>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <div class="font-semibold text-white text-sm">${n.title}</div>
                  ${!n.is_read ? '<span class="w-2 h-2 bg-brand-cyan rounded-full"></span>' : ''}
                </div>
                <div class="text-sm text-slate-400 mb-1">${n.message}</div>
                <div class="text-xs text-slate-500">${fmtRelative(n.created_at)}</div>
              </div>
              ${!n.is_read ? `<button onclick="markRead('${n.id}')" class="text-xs text-brand-cyan hover:text-brand-blue font-semibold">Mark read</button>` : ''}
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
  lucide.createIcons();
}

window.markRead = async (id) => {
  await sb.from('notifications').update({ is_read: true }).eq('id', id);
  await loadUserData();
  renderNotifications();
};
window.markAllRead = async () => {
  await sb.from('notifications').update({ is_read: true }).eq('user_id', state.user.id).eq('is_read', false);
  await loadUserData();
  renderNotifications();
  toast('All notifications marked as read', 'success');
};

// ============ PROFILE ============
function renderProfile() {
  const p = state.profile || {};
  const name = p.full_name || state.user.email.split('@')[0];
  $('#pageContent').innerHTML = `
    <div class="mb-8">
      <h1 class="font-display text-3xl md:text-4xl font-bold text-white mb-1">Profile</h1>
      <p class="text-slate-400">Manage your personal information.</p>
    </div>
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="glass rounded-2xl p-6 text-center">
        <div class="w-24 h-24 gradient-brand rounded-full flex items-center justify-center text-white text-3xl font-bold mx-auto mb-4 pulse-glow">
          ${name.charAt(0).toUpperCase()}
        </div>
        <h3 class="font-display font-bold text-white text-lg">${name}</h3>
        <p class="text-sm text-slate-400 mb-4">${state.user.email}</p>
        <div class="flex items-center justify-center gap-2 text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-full mx-auto w-fit border border-emerald-500/20">
          <i data-lucide="shield-check" class="w-3 h-3"></i> Verified Account
        </div>
        <div class="mt-4 pt-4 border-t border-white/5 text-xs text-slate-500">
          Member since ${fmtDate(p.created_at)}
        </div>
      </div>
      <div class="lg:col-span-2 glass rounded-2xl p-6">
        <h3 class="font-display font-bold text-white mb-6">Personal Information</h3>
        <form id="profileForm" class="space-y-4">
          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">FULL NAME</label>
              <input type="text" id="pfName" value="${p.full_name || ''}" class="input-field w-full px-4 py-2.5 rounded-xl">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">EMAIL</label>
              <input type="email" value="${state.user.email}" disabled class="w-full px-4 py-2.5 rounded-xl bg-white/5 text-slate-500 border border-white/5">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">PHONE</label>
              <input type="tel" id="pfPhone" value="${p.phone || ''}" class="input-field w-full px-4 py-2.5 rounded-xl">
            </div>
          </div>
          <button type="submit" id="pfBtn" class="btn-primary px-6 py-2.5 rounded-xl font-semibold">Save Changes</button>
        </form>
      </div>
    </div>
  `;
  lucide.createIcons();

  $('#profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#pfBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    const { error } = await sb.from('profiles').update({
      full_name: $('#pfName').value,
      phone: $('#pfPhone').value,
      updated_at: new Date().toISOString()
    }).eq('user_id', state.user.id);
    btn.disabled = false;
    btn.textContent = 'Save Changes';
    if (error) toast(error.message, 'error');
    else {
      toast('Profile updated', 'success');
      await loadUserData();
      renderProfile();
    }
  });
}

// ============ SECURITY ============
function renderSecurity() {
  $('#pageContent').innerHTML = `
    <div class="mb-8">
      <h1 class="font-display text-3xl md:text-4xl font-bold text-white mb-1">Security</h1>
      <p class="text-slate-400">Keep your account safe and secure.</p>
    </div>
    <div class="grid md:grid-cols-2 gap-6">
      <div class="glass rounded-2xl p-6">
        <h3 class="font-display font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="shield" class="w-5 h-5 text-brand-cyan"></i> Password</h3>
        <p class="text-sm text-slate-400 mb-4">Change your password regularly to keep your account secure.</p>
        <button onclick="openChangePw()" class="btn-ghost w-full py-2.5 rounded-xl font-semibold flex items-center justify-center gap-2">
          <i data-lucide="key" class="w-4 h-4"></i> Change Password
        </button>
      </div>
      <div class="glass rounded-2xl p-6">
        <h3 class="font-display font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="smartphone" class="w-5 h-5 text-brand-cyan"></i> Two-Factor Auth</h3>
        <p class="text-sm text-slate-400 mb-4">Add an extra layer of security to your account.</p>
        <button onclick="toast('Two-factor authentication coming soon', 'info')" class="btn-ghost w-full py-2.5 rounded-xl font-semibold flex items-center justify-center gap-2">
          <i data-lucide="shield-plus" class="w-4 h-4"></i> Enable 2FA
          <span class="text-xs text-amber-400 ml-1">(Coming soon)</span>
        </button>
      </div>
      <div class="glass rounded-2xl p-6 md:col-span-2">
        <h3 class="font-display font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="monitor" class="w-5 h-5 text-brand-cyan"></i> Active Sessions</h3>
        <div class="p-4 bg-white/5 rounded-xl border border-white/5 flex items-center gap-4">
          <div class="w-10 h-10 bg-brand-cyan/10 rounded-xl flex items-center justify-center">
            <i data-lucide="monitor" class="w-5 h-5 text-brand-cyan"></i>
          </div>
          <div class="flex-1">
            <div class="font-semibold text-white text-sm">Current Session</div>
            <div class="text-xs text-slate-400">${navigator.userAgent.slice(0, 60)}...</div>
          </div>
          <span class="bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-2 py-1 rounded-full border border-emerald-500/20">Active</span>
        </div>
      </div>
    </div>
  `;
  lucide.createIcons();
}

window.openChangePw = () => {
  openModal(`
    <div class="flex items-center justify-between mb-6">
      <h3 class="font-display text-xl font-bold text-white">Change Password</h3>
      <button onclick="closeModal()" class="p-1 hover:bg-white/10 rounded-lg"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
    </div>
    <form id="pwForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">NEW PASSWORD</label>
        <input type="password" id="newPw" required minlength="8" class="input-field w-full px-4 py-2.5 rounded-xl" placeholder="Min. 8 characters">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">CONFIRM PASSWORD</label>
        <input type="password" id="confirmPw" required class="input-field w-full px-4 py-2.5 rounded-xl">
      </div>
      <button type="submit" class="btn-primary w-full py-2.5 rounded-xl font-semibold">Update Password</button>
    </form>
  `);
  $('#pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if ($('#newPw').value !== $('#confirmPw').value) { toast('Passwords do not match', 'error'); return; }
    const { error } = await sb.auth.updateUser({ password: $('#newPw').value });
    if (error) toast(error.message, 'error');
    else { toast('Password updated', 'success'); closeModal(); }
  });
};

// ============ SUPPORT ============
function renderSupport() {
  $('#pageContent').innerHTML = `
    <div class="mb-8 flex items-center justify-between flex-wrap gap-4">
      <div>
        <h1 class="font-display text-3xl md:text-4xl font-bold text-white mb-1">Support</h1>
        <p class="text-slate-400">Get help from our support team.</p>
      </div>
      <button onclick="openNewTicket()" class="btn-primary px-5 py-2.5 rounded-xl font-semibold flex items-center gap-2">
        <i data-lucide="plus" class="w-4 h-4"></i> New Ticket
      </button>
    </div>
    <div class="glass rounded-2xl overflow-hidden">
      ${state.tickets.length === 0 ? emptyState('life-buoy', 'No support tickets', 'Submit a ticket and our team will get back to you.') : `
        <div class="divide-y divide-white/5">
          ${state.tickets.map(t => `
            <div class="p-5 hover:bg-white/5 transition">
              <div class="flex items-start justify-between gap-4 mb-2">
                <h4 class="font-semibold text-white">${t.subject}</h4>
                <span class="px-2 py-1 text-xs font-semibold rounded-full capitalize ${t.status === 'open' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : t.status === 'resolved' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-sky-500/10 text-sky-400 border border-sky-500/20'}">${t.status}</span>
              </div>
              <p class="text-sm text-slate-400 mb-2 line-clamp-2">${t.message}</p>
              <div class="text-xs text-slate-500">${fmtDateTime(t.created_at)}</div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
  lucide.createIcons();
}

window.openNewTicket = () => {
  openModal(`
    <div class="flex items-center justify-between mb-6">
      <h3 class="font-display text-xl font-bold text-white">New Support Ticket</h3>
      <button onclick="closeModal()" class="p-1 hover:bg-white/10 rounded-lg"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
    </div>
    <form id="ticketForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">SUBJECT</label>
        <input type="text" id="tkSubject" required class="input-field w-full px-4 py-2.5 rounded-xl" placeholder="Brief description">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 tracking-wider">MESSAGE</label>
        <textarea id="tkMessage" required rows="5" class="input-field w-full px-4 py-2.5 rounded-xl resize-none" placeholder="Describe your issue..."></textarea>
      </div>
      <button type="submit" class="btn-primary w-full py-3 rounded-xl font-semibold">Submit Ticket</button>
    </form>
  `);
  $('#ticketForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { error } = await sb.from('support_tickets').insert({
      user_id: state.user.id,
      subject: $('#tkSubject').value,
      message: $('#tkMessage').value
    });
    if (error) toast(error.message, 'error');
    else {
      toast('Ticket submitted', 'success');
      closeModal();
      await loadUserData();
      renderSupport();
    }
  });
};

// ============ INIT ============
window.addEventListener('DOMContentLoaded', () => {
  if (!sb || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    renderSetupScreen();
    return;
  }
  router();
});
</script>
</body>
</html>
